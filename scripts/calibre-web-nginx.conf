# RELATED: https://github.com/janeczku/calibre-web/wiki/Setup-Reverse-Proxy

# http://box/library/calibre-web/<author>/<title>/<webm_or_mp4_video_file>
location /library/calibre-web/ {
    alias /library/www/html/calibre-web/;
    fancyindex on;    # autoindex on;
}

# Internal location used by X-Accel-Redirect for video playback and for
# downloading large files (e.g. videos and audiobooks). nginx sends the file
# itself, so Calibre-Web does not have to read it into memory.
# The alias must point at the Calibre library root (Basic Configuration >
# Location of Calibre Database, e.g. /library/calibre-web).
location /protected-stream/ {
    internal;
    alias /library/calibre-web/;
}
